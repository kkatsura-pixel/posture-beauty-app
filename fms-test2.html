<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMS Test 2</title>
<style>
body{background:#080A0F;color:#F0F2F8;font-family:sans-serif;padding:20px;}
.screen{display:none;}.screen.active{display:block;}
.btn{width:100%;padding:16px;background:#00E5C0;color:#080A0F;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;display:block;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.score-btn{width:60px;height:60px;border:2px solid #333;background:transparent;color:#aaa;border-radius:10px;margin-right:8px;cursor:pointer;font-size:20px;}
.score-btn.active{border-color:#00E5C0;color:#00E5C0;background:rgba(0,229,192,.15);}
.card{background:#161B26;border-radius:12px;padding:16px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="s1" class="screen active">
  <h2 style="margin-bottom:16px;">FMS セルフチェック</h2>
  <button class="btn" onclick="goTo('s2')">採点をはじめる →</button>
</div>

<div id="s2" class="screen">
  <h2 style="margin-bottom:4px;">採点フォーム</h2>
  <p id="status" style="color:#6B7694;font-size:13px;margin-bottom:16px;">0 / 7 採点済み</p>
  <div id="tests"></div>
  <button class="btn" id="calc-btn" onclick="goTo('s3')" disabled>結果を見る →</button>
</div>

<div id="s3" class="screen">
  <h2>結果画面</h2>
  <p id="result" style="font-size:24px;margin:16px 0;"></p>
  <button class="btn" onclick="reset()">やり直す</button>
</div>

<script>
var names = ['ディープスクワット','ハードルステップ','インラインランジ','ショルダーモビリティ','アクティブストレートレッグレイズ','トランクスタビリティプッシュアップ','ロータリースタビリティ'];
var scores = [null,null,null,null,null,null,null];

function goTo(id) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if (id === 's2') buildTests();
  if (id === 's3') showResult();
}

function buildTests() {
  var tc = document.getElementById('tests');
  tc.innerHTML = '';
  for (var i=0;i<7;i++) {
    var d = document.createElement('div');
    d.className = 'card';
    var btns = '';
    for (var v=0;v<=3;v++) {
      btns += '<button class="score-btn" onclick="setScore('+i+','+v+',this)">'+v+'</button>';
    }
    d.innerHTML = '<p style="margin-bottom:10px;font-weight:500;">'+(i+1)+'. '+names[i]+'</p><div>'+btns+'</div>';
    tc.appendChild(d);
  }
}

function setScore(i, val, btn) {
  scores[i] = val;
  var btns = btn.parentNode.querySelectorAll('.score-btn');
  btns.forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var done = scores.filter(function(s){return s!==null;}).length;
  document.getElementById('status').textContent = done + ' / 7 採点済み';
  document.getElementById('calc-btn').disabled = (done < 7);
}

function showResult() {
  var total = 0;
  for (var i=0;i<7;i++) total += scores[i];
  document.getElementById('result').textContent = '合計スコア: ' + total + ' / 21点';
}

function reset() {
  scores = [null,null,null,null,null,null,null];
  goTo('s1');
}
</script>
</body>
</html>
